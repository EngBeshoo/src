{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1>Home page</h1>
    
    <h2>Nums of books {{num_books}}</h2>
    <h2>books availabel  {{num_book_avail}}</h2>

    {% if request.user.is_authenticated %}
        <p>you are logged</p>
        <p>Welcom : {{requset.user.username | title}}</p>
        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            <button type='submit'>logout</button>
            <br>
            <a href="{% url 'pass-change' %}">Change password</a>
           
        </form>
    {% else %}
        <p>please login</p>
        <a href="{% url 'login' %}?next={{request.path}}">login</a>
        <br>
        <a href="{% url 'register' %}?next=/accounts/login">register</a>
    {% endif %}
    
</body>
</html>
